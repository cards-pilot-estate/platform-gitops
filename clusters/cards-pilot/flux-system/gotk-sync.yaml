# This repository is public, so the cluster pulls it without a credential.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 2m
  url: https://github.com/cards-pilot-estate/platform-gitops
  ref:
    branch: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 10m
  path: ./clusters/cards-pilot
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
