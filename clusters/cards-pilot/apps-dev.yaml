# The dev environment's team services, after the infrastructure is ready.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-dev
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure
    - name: infrastructure-kind   # channel-web's certificate comes from the local CA
  interval: 10m
  path: ./apps/dev
  prune: true
  wait: true
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
