# The gateway controller (api-gateway repo: values/envoy-gateway.yaml). Adopts release `eg`.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: { name: eg, namespace: envoy-gateway-system }
spec:
  interval: 30m
  releaseName: eg
  chart:
    spec:
      chart: gateway-helm
      version: v1.9.3
      sourceRef: { kind: HelmRepository, name: envoyproxy, namespace: flux-system }
  install: { crds: CreateReplace }
  upgrade: { crds: CreateReplace }
  values:
    deployment:
      envoyGateway:
        resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { memory: 256Mi } }
    config:
      envoyGateway:
        gateway: { controllerName: gateway.envoyproxy.io/gatewayclass-controller }
        provider:
          type: Kubernetes
          kubernetes:
            rateLimitDeployment:
              container:
                resources: { requests: { cpu: 20m, memory: 32Mi }, limits: { memory: 128Mi } }
        logging: { level: { default: info } }
        rateLimit:
          backend:
            type: Redis
            redis: { url: gateway-redis.api-gateway.svc.cluster.local:6379 }
