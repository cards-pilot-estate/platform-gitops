# Flux is the only installer of cert-manager (card-onboarding-platform#129, ADR-0022). It adopted the release
# `make tls` used to install (same name and namespace); the local CA lives in infrastructure/kind/.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: { name: cert-manager, namespace: cert-manager }
spec:
  interval: 30m
  releaseName: cert-manager
  chart:
    spec:
      chart: cert-manager
      version: v1.21.3
      sourceRef: { kind: HelmRepository, name: jetstack, namespace: flux-system }
  install: { crds: CreateReplace }
  upgrade: { crds: CreateReplace }
  values:
    crds: { enabled: true }
    resources: { requests: { cpu: 10m, memory: 32Mi }, limits: { memory: 128Mi } }
    webhook: { resources: { requests: { cpu: 10m, memory: 16Mi }, limits: { memory: 64Mi } } }
    cainjector: { resources: { requests: { cpu: 10m, memory: 32Mi }, limits: { memory: 128Mi } } }
    startupapicheck: { enabled: true }
